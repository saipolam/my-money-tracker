<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c31"><meta name="description" content="Private offline money tracker for income, expenses, debts and EMI loans.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>My Money — Tracker</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#142033;--muted:#718096;--line:#e7ebf2;--nav:#101c31;--blue:#4768f5;--green:#138a62;--red:#d94c62;--amber:#d38a16;--shadow:0 8px 24px #1a2a4810}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh}.top{background:var(--nav);color:white;padding:22px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:#283b5b;display:grid;place-items:center;font-size:23px}.brand h1{font-size:19px;margin:0}.brand p{margin:2px 0 0;color:#b8c4d8;font-size:12px}.top-actions{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:650;background:var(--blue);color:white}.btn.secondary{background:#e9edff;color:#3349c8}.btn.ghost{background:#253650;color:#fff}.btn.danger{background:#fff0f1;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.nav{display:flex;gap:5px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav button{white-space:nowrap;border:0;background:transparent;color:#68768c;padding:11px 14px;border-radius:10px;font-weight:650}.nav button.active{background:#e9edff;color:#354ce0}.main{padding:22px 18px 90px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.page-head h2{margin:0;font-size:24px;letter-spacing:-.5px}.page-head p{margin:5px 0 0;color:var(--muted)}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters select,.filters input{width:auto;min-width:125px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:17px}.stat .label{font-size:13px;color:var(--muted);font-weight:600}.stat .value{font-size:25px;font-weight:780;letter-spacing:-.6px;margin:9px 0 5px;overflow-wrap:anywhere}.stat .hint{font-size:12px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.panel{padding:18px;margin-bottom:16px;min-width:0}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel-title h3{margin:0;font-size:16px}.panel-title p{margin:3px 0 0;color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.bar-list{display:grid;gap:13px}.bar-row{display:grid;grid-template-columns:minmax(100px,1fr) 2fr auto;gap:10px;align-items:center;font-size:13px}.bar-track{height:8px;background:#eef1f7;border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:var(--blue);border-radius:20px}.bar-value{font-weight:700;font-variant-numeric:tabular-nums}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750}td.amount,th.amount{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:750;background:#eef2f8;color:#53627a}.pill.credit,.pill.paid{background:#e5f7ef;color:#13845e}.pill.expense,.pill.overdue{background:#fff0f1;color:#c13c53}.pill.owe{background:#fff5df;color:#98600c}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#5d6b80}.field input,.field select,.field textarea,.filters select,.filters input{width:100%;border:1px solid #dfe5ee;background:#fff;border-radius:10px;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.filters select:focus{border-color:#8292ff;box-shadow:0 0 0 3px #4768f51a}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-backdrop{position:fixed;inset:0;background:#0d172b88;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.modal-backdrop.open{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px;padding:20px;box-shadow:0 20px 80px #0003}.modal h3{margin:0 0 16px}.close-row{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f0f3f8;border-radius:10px;padding:7px 10px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#142033;color:white;border-radius:12px;padding:12px 16px;z-index:40;transition:.2s;box-shadow:var(--shadow);max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}.notice{background:#fff8e8;border:1px solid #f2dfb6;color:#825c17;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.settings-action{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.settings-action:last-child{border-bottom:0}.settings-action strong{display:block;font-size:14px}.settings-action small{color:var(--muted)}.mobile-add{display:none}.month-select{display:flex;gap:8px}.muted{color:var(--muted)}.footer{text-align:center;color:#94a0b1;font-size:11px;padding:20px}.chart-empty{color:var(--muted);font-size:13px}
@media(max-width:760px){.top{padding:17px 15px}.top-actions .btn span{display:none}.top-actions .btn{padding:10px 12px}.main{padding:18px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px}.stat .value{font-size:22px}.two{grid-template-columns:1fr;gap:0}.page-head{flex-direction:column}.page-head h2{font-size:22px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.settings-grid{grid-template-columns:1fr}.nav{padding:8px 9px}.nav button{padding:10px 12px;font-size:13px}.panel{padding:14px;border-radius:15px}.bar-row{grid-template-columns:100px 1fr auto;gap:7px}.mobile-add{display:block;position:fixed;right:18px;bottom:20px;z-index:8;width:56px;height:56px;border-radius:50%;font-size:25px;box-shadow:0 10px 25px #4768f555}.modal-backdrop{padding:0}.modal{border-radius:22px 22px 0 0;max-height:94vh}.filters{width:100%}.filters select{flex:1;min-width:0}.page-head .filters{margin-top:4px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">₹</div><div><h1>My Money</h1><p>Personal finance, made simple</p></div></div><div class="top-actions"><button class="btn ghost" id="installBtn" hidden>＋ Install</button><button class="btn secondary" id="quickAdd">＋ <span>Add transaction</span></button></div></header><nav class="nav" id="nav"><button class="active" data-page="dashboard">Overview</button><button data-page="transactions">Transactions</button><button data-page="debts">Debts</button><button data-page="loans">EMI & loans</button><button data-page="funds">Savings & investments</button><button data-page="reports">Reports</button><button data-page="settings">Settings</button></nav><main class="main" id="main"></main><footer class="footer">Your money data stays on this device unless you export or share it.</footer></div>
<button class="btn mobile-add" id="mobileAdd" aria-label="Add transaction">＋</button><div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal"></section></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="app.js"></script></body></html>
